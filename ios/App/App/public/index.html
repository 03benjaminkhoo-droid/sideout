<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>html{color-scheme:light dark}body{margin:0}</style>
<title>Sideout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky bar (brand + tabs), then stacked panels; team cards sit in an auto-fit grid like pinnies laid out on a bench. */
:root {
  --bg: #EDF0F4; --surface: #FFFFFF; --sunken: #E2E7ED; --ink: #11202F; --muted: #566677; --line: #D1D8E0;
  --accent: #1F4ED8; --accent-ink: #FFFFFF; --good: #1B7F55; --warn: #9A5B08; --bad: #B2381A;
  --disp: 'Big Shoulders Display', 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --t0: #F2701D; --t1: #2A9DDB; --t2: #7DB82A; --t3: #E8508F; --t4: #7C5CE0; --t5: #14A58F; --t6: #E3B30B; --t7: #D83B3B;
  --t0i: #11202F; --t1i: #11202F; --t2i: #11202F; --t3i: #11202F; --t4i: #FFFFFF; --t5i: #11202F; --t6i: #11202F; --t7i: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D151E; --surface: #15212D; --sunken: #1F2E3E; --ink: #E8EEF4; --muted: #9BABBB; --line: #263749;
    --accent: #7D9EFF; --accent-ink: #0B1220; --good: #4CC48C; --warn: #E6A64A; --bad: #FF8A6A;
    --t0: #FF8A3D; --t1: #4DB6F0; --t2: #98D44A; --t3: #FF6FA8; --t4: #9C80FF; --t5: #2CC4AD; --t6: #F2C830; --t7: #F25C5C;
    --t4i: #11202F; --t7i: #11202F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D151E; --surface: #15212D; --sunken: #1F2E3E; --ink: #E8EEF4; --muted: #9BABBB; --line: #263749;
  --accent: #7D9EFF; --accent-ink: #0B1220; --good: #4CC48C; --warn: #E6A64A; --bad: #FF8A6A;
  --t0: #FF8A3D; --t1: #4DB6F0; --t2: #98D44A; --t3: #FF6FA8; --t4: #9C80FF; --t5: #2CC4AD; --t6: #F2C830; --t7: #F25C5C;
  --t4i: #11202F; --t7i: #11202F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 0 56px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; }

:root { --sat: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)); }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); margin-inline: -16px; padding: calc(12px + var(--sat)) 16px 12px; border-bottom: 1px solid var(--line); }
.top::after { content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 16px; background: linear-gradient(var(--bg), transparent); pointer-events: none; }
.top .wrap { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--accent); }
.brand h1 { margin: 0; font-family: var(--disp); font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink); }
.tabs { display: flex; gap: 2px; background: var(--sunken); padding: 3px; border-radius: 10px; flex: 1 1 320px; max-width: 520px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 7px 4px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.18); }

main { display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2, .sec-h { margin: 0; font-family: var(--disp); font-weight: 800; font-size: 22px; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.1; }
.hrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
.sub { color: var(--muted); font-size: 13.5px; margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 12px 22px; font-size: 16px; font-family: var(--disp); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
.btn.primary:disabled { opacity: .6; cursor: progress; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-weight: 500; }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.chip.sm { padding: 3px 10px; font-size: 13.5px; }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--sunken); width: 38px; height: 38px; font-size: 20px; line-height: 1; }
.stepper output { padding: 0 8px; white-space: nowrap; min-width: 44px; text-align: center; font-family: var(--disp); font-weight: 800; font-size: 26px; }
.sizes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sz { display: inline-grid; place-items: center; min-width: 38px; height: 30px; padding-inline: 6px; border-radius: 6px; background: var(--tc); color: var(--tci); font-family: var(--disp); font-weight: 800; font-size: 20px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="time"], input[type="number"], select, textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { min-height: 96px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
input[type="range"] { accent-color: var(--accent); width: 100%; min-width: 0; }
.note { padding: 9px 12px; border-radius: 8px; background: var(--sunken); font-size: 14px; }
.note.warn { border-left: 4px solid var(--warn); }
.note.bad { border-left: 4px solid var(--bad); }
.note.good { border-left: 4px solid var(--good); }

.verdict { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: center; }
.verdict .big { font-family: var(--disp); font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase; letter-spacing: 0.04em; }
.verdict .big.good { color: var(--good); } .verdict .big.warn { color: var(--warn); } .verdict .big.bad { color: var(--bad); }
.stat { display: flex; flex-direction: column; }
.stat b { font-variant-numeric: tabular-nums; font-size: 17px; }
.stat span { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.team-h { background: var(--tc); color: var(--tci); padding: 10px 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.team-h .nm { font-family: var(--disp); font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: .05em; text-transform: uppercase; }
.team-h .ct { font-size: 13px; font-weight: 600; opacity: .85; }
.team-h .tsc { text-align: right; }
.team-h .tsc b { display: block; font-family: var(--disp); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.team-h .tsc span { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .85; }
.pl { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 9px 14px; }
.pl:hover { background: var(--sunken); }
.pl.sel { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); box-shadow: inset 3px 0 0 var(--accent); }
.pl .nm { font-weight: 600; overflow-wrap: anywhere; }
.pl .role { font-size: 12.5px; color: var(--muted); }
.pl .rt { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-weight: 700; min-width: 86px; justify-content: flex-end; }
.bar { display: inline-block; width: 40px; height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.tag { font-style: normal; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-weight: 700; }
.team-f { border-top: 1px solid var(--line); padding: 8px 14px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.team-f.bad { color: var(--bad); }

.tbl { overflow-x: auto; }
table.skills { border-collapse: collapse; width: 100%; min-width: 420px; font-variant-numeric: tabular-nums; }
table.skills th, table.skills td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.skills th { font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--tc); margin-right: 6px; }
.mb { display: inline-block; width: 42px; height: 5px; border-radius: 3px; background: var(--sunken); margin-left: 8px; vertical-align: middle; overflow: hidden; }
.mb i { display: block; height: 100%; background: var(--ink); opacity: .55; }
td.gap.hi { color: var(--warn); font-weight: 700; }

.rlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.rrow { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; width: 100%; text-align: left; border: 0; background: var(--surface); padding: 11px 14px; align-items: center; border-top: 1px solid var(--line); }
.rrow:first-child { border-top: 0; }
.rrow[aria-expanded="true"] { background: var(--sunken); }
.rrow .nm { font-weight: 600; }
.rrow .meta { font-size: 12.5px; color: var(--muted); }
.editor { background: var(--surface); border-top: 1px solid var(--line); padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.sk { display: grid; grid-template-columns: 110px 1fr 62px; gap: 10px; align-items: center; }
.snum { text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; padding: 6px 4px !important; }
.bx { display: inline-block; position: relative; width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 6px; margin-right: 10px; vertical-align: -4px; flex: none; }
.bx.on { background: var(--accent); border-color: var(--accent); }
.bx.on::after { content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.mrow.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.rnd { font-family: var(--disp); font-weight: 800; font-size: 22px; letter-spacing: .05em; text-transform: uppercase; }
.sk span:first-child { font-size: 14px; font-weight: 600; }
.sk output { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.ov { display: flex; align-items: baseline; gap: 8px; }
.ov b { font-family: var(--disp); font-weight: 800; font-size: 34px; line-height: 1; }
.legend { font-size: 12.5px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 14px; font-weight: 600; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.rule { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.rule:first-of-type { border-top: 0; padding-top: 0; }
.rule .t { font-weight: 700; }
.hint { color: var(--muted); font-size: 13.5px; margin: 0; }
/* player lists, matches, scoring */
.field .stepper { align-self: flex-start; }
.grow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.btn.hl { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.slotbox { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.slotbox:first-of-type { border-top: 0; padding-top: 0; }
.slot-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; }
.slot-h b { font-family: var(--disp); font-weight: 800; font-size: 20px; letter-spacing: .05em; text-transform: uppercase; }
.slot-h span { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mrow { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; }
.mrow:hover { border-color: var(--muted); }
.mrow .court { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-width: 64px; }
.vs { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; flex: 1 1 190px; min-width: 0; }
.vs .x { color: var(--muted); font-size: 13px; }
.tp { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.tp .dot { margin-right: 0; }
.badge { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge.live { background: var(--accent); color: var(--accent-ink); }
.badge.next { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
.badge.done { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.rest { font-size: 13px; color: var(--muted); }
.rr { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.rr .rl { font-weight: 600; }
.rules-grid { display: flex; flex-direction: column; gap: 14px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.tcfg { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.rank { font-family: var(--disp); font-weight: 800; font-size: 20px; }
.banner { padding: 10px 14px; border-radius: 8px; font-family: var(--disp); font-weight: 800; font-size: 24px; letter-spacing: .05em; text-transform: uppercase; line-height: 1.15; background: var(--sunken); }
.banner.warn { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); color: var(--warn); }
.banner.good { background: color-mix(in srgb, var(--good) 20%, var(--surface)); color: var(--good); }
.banner.hot { background: var(--accent); color: var(--accent-ink); }
.sbgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sc { display: flex; flex-direction: column; align-items: stretch; padding: 0; overflow: hidden; text-align: center; border: 2px solid var(--tc); border-radius: 12px; background: var(--surface); min-width: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
.sc:disabled { cursor: default; opacity: 1; }
.sc .hd { display: flex; justify-content: space-between; align-items: center; gap: 6px; background: var(--tc); color: var(--tci); padding: 8px 10px; font-family: var(--disp); font-weight: 800; font-size: 24px; letter-spacing: .05em; text-transform: uppercase; line-height: 1.1; min-height: 48px; }
.sc .hd { flex-wrap: wrap; row-gap: 2px; }
.sc .srv { font-family: var(--body); font-size: 11px; letter-spacing: .06em; font-weight: 700; border: 1.5px solid currentColor; border-radius: 999px; padding: 1px 7px; }
.sc .num { display: block; font-family: var(--disp); font-weight: 800; font-size: clamp(84px, 24vw, 160px); line-height: 1; padding: 14px 0 6px; font-variant-numeric: tabular-nums; }
.sc .pips { display: flex; justify-content: center; gap: 6px; min-height: 18px; padding-bottom: 8px; }
.pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--tc); }
.pip.on { background: var(--tc); }
.sc .plus { display: block; background: var(--sunken); padding: 14px 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; }
.sc:not(:disabled):active .plus { background: var(--tc); color: var(--tci); }
.subbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.subbox.due { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-color: var(--warn); }
.subs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.netpill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; background: var(--surface); }
.netpill.on { color: var(--good); border-color: var(--good); }
.netpill.wait { color: var(--warn); border-color: var(--warn); }
.code { font-family: var(--disp); font-weight: 800; font-size: 40px; letter-spacing: .18em; line-height: 1; padding: 6px 0; user-select: all; }
@media (max-width: 480px) { .sk { grid-template-columns: 88px 1fr 62px; } .brand h1 { font-size: 24px; } .sc .hd { font-size: 20px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="1.5" stroke-width="2"/><path d="M12 4v16" stroke-width="3"/><path d="M7 4v16M17 4v16" stroke-width="1.3"/></svg>
    <h1>Sideout</h1><button class="netpill" id="netpill" data-act="netGo" hidden></button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</div></div>
<div class="wrap"><main id="view"></main></div>

<script>
/* Sideout balancing engine. Pure functions, no DOM. */
const ATTRS = [
  { key: 'serve',    label: 'Serving' },
  { key: 'receive',  label: 'Receiving' },
  { key: 'set',      label: 'Setting' },
  { key: 'spike',    label: 'Spiking' },
  { key: 'block',    label: 'Blocking' },
  { key: 'defend',   label: 'Defence' },
  { key: 'athletic', label: 'Athleticism' }
];
const ROLES = ['Any', 'Setter', 'Outside', 'Middle', 'Opposite', 'Libero'];
const COURT = 6; // players on court at once

const DEFAULT_OPTS = {
  weights: { serve: 1, receive: 1.2, set: 1, spike: 1.2, block: 0.8, defend: 1, athletic: 0.6 },
  handicap: 0.5,      // a missing 6th player counts as this share of an average player
  bench: 0.35,        // credit for each player beyond six (rotation / subbing)
  prefPriority: 1,    // 0 off, 0.5 low, 1 normal, 2 high
  requireSetter: true,
  setterMin: 7,       // a player with Setting >= this counts as setter-capable
  genderBalance: false,
  groupSpread: false, // spread each player list (e.g. hall, club) evenly across teams
  variety: false,
  history: []         // array of teams, each an array of player ids
};

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function overall(p, weights) {
  let s = 0, t = 0;
  for (const a of ATTRS) {
    const w = weights[a.key] == null ? 1 : weights[a.key];
    s += (p.s[a.key] || 5) * w; t += w;
  }
  return t > 0 ? s / t : 5;
}

function teamSizes(n, k) {
  const base = Math.floor(n / k), extra = n % k, out = [];
  for (let i = 0; i < k; i++) out.push(base + (i < extra ? 1 : 0));
  return out;
}

function makeCtx(players, optsIn) {
  const opts = Object.assign({}, DEFAULT_OPTS, optsIn || {});
  opts.weights = Object.assign({}, DEFAULT_OPTS.weights, (optsIn && optsIn.weights) || {});
  const n = players.length;
  const index = new Map(players.map((p, i) => [p.id, i]));
  const r = players.map(p => overall(p, opts.weights));
  const attr = players.map(p => ATTRS.map(a => p.s[a.key] || 5));
  const meanR = n ? r.reduce((a, b) => a + b, 0) / n : 5;
  const meanAttr = ATTRS.map((_, ai) => n ? attr.reduce((a, row) => a + row[ai], 0) / n : 5);
  const wsum = ATTRS.reduce((a, x) => a + (opts.weights[x.key] == null ? 1 : opts.weights[x.key]), 0) || 1;
  const attrW = ATTRS.map(x => ((opts.weights[x.key] == null ? 1 : opts.weights[x.key]) / wsum) * ATTRS.length);

    (p.with || []).forEach(id => { const j = index.get(id); if (j != null && j !== i) wants.push([i, j]); });

      const j = index.get(id);

        if (!apartSet.has(key)) { apartSet.add(key); apart.push([Math.min(i, j), Math.max(i, j)]); }

  const female = players.map(p => p.gender === 'F');
  const anyGender = players.some(p => p.gender === 'F' || p.gender === 'M');
  const gl = new Map();
  players.forEach((p, i) => (p.groups || []).forEach(g => { if (!gl.has(g)) gl.set(g, []); gl.get(g).push(i); }));
  const groups = [...gl.values()].filter(l => l.length >= 2);

  if (opts.variety) {
    (opts.history || []).forEach(team => {
      const ix = team.map(id => index.get(id)).filter(v => v != null);
      for (let a = 0; a < ix.length; a++) for (let b = a + 1; b < ix.length; b++)
        hist.add(Math.min(ix[a], ix[b]) * n + Math.max(ix[a], ix[b]));

  return { players, opts, n, index, r, attr, meanR, meanAttr, attrW, wants, apart, isSetter, female, anyGender, hist, groups };
}

function teamStats(m, ctx) {
  const { r, attr, opts } = ctx;
  const sorted = m.slice().sort((a, b) => r[b] - r[a]);
  const court = sorted.slice(0, COURT), bench = sorted.slice(COURT);
  const missing = Math.max(0, COURT - sorted.length);
  let courtSum = 0, benchSum = 0;
  for (const i of court) courtSum += r[i];
  for (const i of bench) benchSum += r[i];
  const strength = courtSum + missing * opts.handicap * ctx.meanR + opts.bench * benchSum;
  const attrs = ATTRS.map((_, ai) => {
    let s = 0;
    for (const i of court) s += attr[i][ai];
    return s + missing * opts.handicap * ctx.meanAttr[ai];
  });
  const top2 = r[sorted[0]] + (sorted.length > 1 ? r[sorted[1]] : 0);
  let setters = 0, fem = 0, rsum = 0;
  for (const i of m) { if (ctx.isSetter[i]) setters++; if (ctx.female[i]) fem++; rsum += r[i]; }
  return { strength, attrs, top2, setters, fem, avg: m.length ? rsum / m.length : 0, sorted, court, bench, missing };
}

/* teams: array of arrays of player indexes */
function evaluateTeams(teams, ctx, wantDetail) {
  const k = teams.length;
  const stats = teams.map(t => teamStats(t, ctx));
  const teamOf = new Int16Array(ctx.n).fill(-1);
  teams.forEach((t, ti) => t.forEach(i => { teamOf[i] = ti; }));
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;

  const mS = mean(stats.map(s => s.strength));
  let cStrength = 0; stats.forEach(s => { cStrength += (s.strength - mS) ** 2; });
  cStrength *= 10;

  let cAttr = 0;
  ATTRS.forEach((_, ai) => {
    const m = mean(stats.map(s => s.attrs[ai]));
    let v = 0; stats.forEach(s => { v += (s.attrs[ai] - m) ** 2; });
    cAttr += 1.2 * ctx.attrW[ai] * v;
  });

  const mT = mean(stats.map(s => s.top2));
  let cStar = 0; stats.forEach(s => { cStar += (s.top2 - mT) ** 2; });
  cStar *= 3;

  let unmet = 0;
  for (const [a, b] of ctx.wants) if (teamOf[a] !== teamOf[b]) unmet++;
  const cPref = unmet * 6 * ctx.opts.prefPriority;

  let apartBroken = 0;
  for (const [a, b] of ctx.apart) if (teamOf[a] === teamOf[b]) apartBroken++;
  const cApart = apartBroken * 60;

  let noSetter = 0;
  if (ctx.opts.requireSetter) stats.forEach(s => { if (s.setters === 0) noSetter++; });
  const cSetter = noSetter * 20;

  let cGender = 0;
  if (ctx.opts.genderBalance && ctx.anyGender) {
    const F = stats.reduce((a, s) => a + s.fem, 0);
    stats.forEach((s, ti) => { const exp = F * teams[ti].length / ctx.n; cGender += 8 * (s.fem - exp) ** 2; });
  }

  let cGroup = 0;
  if (ctx.opts.groupSpread && ctx.groups.length) {
    for (const list of ctx.groups) {
      const cnt = new Array(k).fill(0);
      for (const i of list) cnt[teamOf[i]]++;
      for (let ti = 0; ti < k; ti++) { const exp = list.length * teams[ti].length / ctx.n; cGroup += 2.5 * (cnt[ti] - exp) ** 2; }
    }
  }

  let repeats = 0;
  if (ctx.hist.size) {
    teams.forEach(t => {
      for (let a = 0; a < t.length; a++) for (let b = a + 1; b < t.length; b++)
        if (ctx.hist.has(Math.min(t[a], t[b]) * ctx.n + Math.max(t[a], t[b]))) repeats++;
    });
  }
  const cVariety = repeats * 1.5;

  const cost = cStrength + cAttr + cStar + cPref + cApart + cSetter + cGender + cGroup + cVariety;
  if (!wantDetail) return cost;
  const sv = stats.map(s => s.strength);
  return {
    cost, stats, unmet, apartBroken, noSetter, repeats,
    spread: Math.max(...sv) - Math.min(...sv),
    meanStrength: mS
  };
}

function slices(order, sizes) {
  const out = []; let off = 0;
  for (const s of sizes) { out.push(order.slice(off, off + s)); off += s; }
  return out;
}

function solve(players, k, optsIn, sizesIn, seed) {
  const n = players.length;
  const ctx = makeCtx(players, optsIn);
  const sizes = sizesIn && sizesIn.length === k && sizesIn.reduce((a, b) => a + b, 0) === n ? sizesIn : teamSizes(n, k);
  const rand = mulberry32(seed == null ? (Math.random() * 2 ** 31) | 0 : seed);
  const posTeam = []; sizes.forEach((s, ti) => { for (let q = 0; q < s; q++) posTeam.push(ti); });
  const costOf = order => evaluateTeams(slices(order, sizes), ctx, false);

  let bestOrder = null, bestCost = Infinity;
  const RESTARTS = n > 30 ? 8 : 12, ITERS = 4500;
  for (let rs = 0; rs < RESTARTS; rs++) {
    const order = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    let cur = costOf(order);
    const T0 = 6, T1 = 0.02;
    for (let it = 0; it < ITERS; it++) {
      const T = T0 * Math.pow(T1 / T0, it / ITERS);
      const a = Math.floor(rand() * n), b = Math.floor(rand() * n);
      if (posTeam[a] === posTeam[b]) continue;
      [order[a], order[b]] = [order[b], order[a]];
      const c = costOf(order);
      if (c <= cur || rand() < Math.exp((cur - c) / T)) cur = c;
      else [order[a], order[b]] = [order[b], order[a]];
    }
    // greedy polish: take any improving swap until none left
    let improved = true;
    while (improved) {
      improved = false;
      for (let a = 0; a < n && !improved; a++) for (let b = a + 1; b < n; b++) {
        if (posTeam[a] === posTeam[b]) continue;
        [order[a], order[b]] = [order[b], order[a]];
        const c = costOf(order);
        if (c < cur - 1e-9) { cur = c; improved = true; break; }
        [order[a], order[b]] = [order[b], order[a]];
      }
    }
    if (cur < bestCost) { bestCost = cur; bestOrder = order.slice(); }
  }
  return slices(bestOrder, sizes).map(t => t.map(i => players[i].id));
}

/* teamsIds: array of arrays of player ids. Returns display-ready analysis. */
function analyze(teamsIds, players, optsIn) {
  const ctx = makeCtx(players, optsIn);
  const teams = teamsIds.map(t => t.map(id => ctx.index.get(id)).filter(v => v != null));
  const ev = evaluateTeams(teams, ctx, true);
  const teamOf = new Map();
  teams.forEach((t, ti) => t.forEach(i => teamOf.set(i, ti)));
  const unmetList = [];
  for (const [a, b] of ctx.wants) if (teamOf.get(a) !== teamOf.get(b)) unmetList.push([players[a].id, players[b].id]);
  const apartList = [];
  for (const [a, b] of ctx.apart) if (teamOf.get(a) === teamOf.get(b)) apartList.push([players[a].id, players[b].id]);
  const out = teams.map((t, ti) => {
    const s = ev.stats[ti];
    return {
      ids: s.sorted.map(i => players[i].id),
      rating: Object.fromEntries(s.sorted.map(i => [players[i].id, ctx.r[i]])),
      benchIds: s.bench.map(i => players[i].id),
      strength: s.strength, avg: s.avg, setters: s.setters, fem: s.fem,
      missing: s.missing, size: t.length,
      attrAvg: s.attrs.map((v, ai) => v / Math.max(1, Math.min(COURT, t.length) + s.missing)),
      delta: s.strength - ev.meanStrength
    };
  });
  const spreadPct = ev.meanStrength ? (ev.spread / ev.meanStrength) * 100 : 0;
  return {
    teams: out, spread: ev.spread, spreadPct, meanStrength: ev.meanStrength,
    wantsTotal: ctx.wants.length, wantsMet: ctx.wants.length - ev.unmet, unmetList,
    apartList, noSetter: ev.noSetter, repeats: ev.repeats, cost: ev.cost,
    overall: id => ctx.r[ctx.index.get(id)]
  };
}


/* Sideout tournament scheduling, match scoring and standings. Pure functions, no DOM. */
const MATCH_DEFAULTS = { target: 25, decider: 15, bestOf: 1, winBy2: true, cap: 0, subEvery: 6 };

function rng32(a) {
  return function () {

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  const hi = Math.max(a, b), lo = Math.min(a, b);
  if (cap > target && hi >= cap) return a > b ? 'a' : 'b';
  if (hi >= target && hi - lo >= (winBy2 ? 2 : 1)) return a > b ? 'a' : 'b';
  return null;

/* Rebuilds the whole match from the point log ('a' / 'b' per rally). Undo = drop the last character. */
function replay(log, rules, firstServe) {

  for (const c of log || '') {

    const idx = sets.length, t = setTargetFor(rules, idx);
    const w = setWinner(cur.a, cur.b, t, rules.winBy2, rules.cap);
    if (w) {
      sets.push({ a: cur.a, b: cur.b, w }); won[w]++;
      cur = { a: 0, b: 0 }; last = null;
      if (won[w] >= need) winner = w;
    } else if (rules.bestOf > 1 && idx === rules.bestOf - 1 && cur[c] === Math.ceil(t / 2) && cur[c] > (c === 'a' ? cur.b : cur.a)) {

    deuce: false, setPoint: null, matchPoint: null

    const wb = setWinner(cur.a, cur.b + 1, target, rules.winBy2, rules.cap) === 'b';

/* ---------- standings ---------- */
function standings(teamIds, matches) {
  const row = {};
  teamIds.forEach(id => { row[id] = { id, p: 0, w: 0, l: 0, sw: 0, sl: 0, pf: 0, pa: 0 }; });
  for (const m of matches) {
    if (!row[m.a] || !row[m.b]) continue;
    const r = replay(m.log, m.rules, m.firstServe);
    if (!r.winner) continue;
    const A = row[m.a], B = row[m.b];
    A.p++; B.p++;
    (r.winner === 'a' ? A : B).w++; (r.winner === 'a' ? B : A).l++;
    A.sw += r.won.a; A.sl += r.won.b; B.sw += r.won.b; B.sl += r.won.a;
    r.sets.forEach(s => { A.pf += s.a; A.pa += s.b; B.pf += s.b; B.pa += s.a; });
  }
  return Object.values(row).sort((x, y) =>
    y.w - x.w || (y.sw - y.sl) - (x.sw - x.sl) || (y.pf - y.pa) - (x.pf - x.pa) || (x.id < y.id ? -1 : 1));

/* ---------- scheduling ---------- */
/* Choose which pairs meet so every team gets g games, preferring opponents not yet met. */
function pickMatches(T, g, rand, share) {
  const target = Math.floor(T * g / 2);
  let best = null;
  for (let attempt = 0; attempt < 80; attempt++) {
    const cnt = Array.from({ length: T }, () => new Array(T).fill(0));
    const gm = new Array(T).fill(0), ms = [];
    while (ms.length < target) {

      for (let i = 0; i < T; i++) {

          const key = cnt[i][j] * 1000 + (gm[i] + gm[j]) * 10 + (share ? (share[i] + share[j]) * 3 : 0) + rand();
          if (key < bestKey) { bestKey = key; pick = [i, j]; }
        }

      if (!pick) break;
      ms.push(pick); cnt[pick[0]][pick[1]]++; gm[pick[0]]++; gm[pick[1]]++;
    }
    let repeats = 0;
    for (let i = 0; i < T; i++) for (let j = i + 1; j < T; j++) if (cnt[i][j] > 1) repeats += cnt[i][j] - 1;

    left.forEach(([i, j]) => { remain[i]++; remain[j]++; });

/* ---------- format suggestion ----------

   A "block" is k full round robins. Stopping after any block keeps every team on the same number of matches. */
function suggestFormat(T, courts) {
  if (T < 2) return null;
  const M = Math.max(1, Math.min(courts, Math.floor(T / 2)));
  const options = [];
  for (let k = 1; k <= 4; k++) {
    const g = k * (T - 1);
    if (g < 3 && k < 4) continue;               // a block should give every team at least 3 matches
    const matches = k * T * (T - 1) / 2, rounds = Math.ceil(matches / M);
    options.push({ k, g, matches, rounds, f: g / rounds, util: matches / (M * rounds) });
  }
  const best = Math.max(...options.map(o => o.f));
  const pick = options.find(o => o.f >= best - 0.05); // prefer the shorter block unless a longer one is clearly better
  return Object.assign({ M, ideal: Math.min(1, 2 * M / T), options, T, courts }, pick);

    const s = suggestFormat(k, courts);
    if (!best || s.f > best.f + 1e-9) best = { k, f: s.f, lo, hi };
  }

}

    ['Mei Ling', 'Outside', 'F', 7, 7, 5, 6, 4, 7, 5], ['Raj', 'Any', 'M', 5, 5, 5, 5, 5, 5, 5],
    ['Hafiz', 'Opposite', 'M', 6, 5, 3, 8, 6, 5, 7], ['Chloe', 'Any', 'F', 4, 5, 6, 4, 3, 6, 4],
    ['Arjun', 'Outside', 'M', 6, 6, 4, 7, 5, 6, 7], ['Farah', 'Any', 'F', 3, 4, 4, 3, 3, 4, 4],
    ['Ethan', 'Middle', 'M', 5, 4, 3, 6, 7, 4, 5], ['Lina', 'Setter', 'F', 5, 5, 7, 4, 3, 5, 4],
    ['Kenji', 'Libero', 'M', 6, 8, 5, 4, 3, 8, 6], ['Zara', 'Outside', 'F', 5, 6, 4, 5, 4, 6, 5]
  ];
  function samplePlayers() {
    const ps = SAMPLE.map((r, i) => ({
      id: 's' + (i + 1), name: r[0], role: r[1], gender: r[2], here: true, with: [], apart: [],
      s: { serve: r[3], receive: r[4], set: r[5], spike: r[6], block: r[7], defend: r[8], athletic: r[9] }
    }));
    const by = n => ps.find(p => p.name === n).id;
    ps.find(p => p.name === 'Aiman').with = [by('Daniel')];
    ps.find(p => p.name === 'Siti').with = [by('Priya')];
    ps.find(p => p.name === 'Raj').with = [by('Hafiz')];
    ps.find(p => p.name === 'Marcus').apart = [by('Wei Jie')];
    const lists = {
      g1: ['Aiman', 'Wei Jie', 'Priya', 'Daniel', 'Jun Hao', 'Nurul', 'Mei Ling', 'Hafiz', 'Arjun'],
      g2: ['Aiman', 'Priya', 'Jun Hao', 'Raj', 'Chloe', 'Farah', 'Siti', 'Ethan'],
      g3: ['Marcus', 'Lina', 'Kenji', 'Zara']
    };
    ps.forEach(p => { p.groups = Object.keys(lists).filter(g => lists[g].includes(p.name)); });
    return ps;
  }
  function defaultRules() {
    const r = {}; RULE_KEYS.forEach(k => { r[k] = JSON.parse(JSON.stringify(DEFAULT_OPTS[k])); }); return r;
  }

  let S = load();
  function fresh() {
    const s = { players: samplePlayers(), sample: true, rules: defaultRules(), k: 3, custom: '', teams: null, history: [], tab: 'session',
      groups: defaultGroups(), mrules: Object.assign({}, MATCH_DEFAULTS), tcfg: defaultTcfg(), tourney: null, scoreId: null, gfS: '', gfR: '' };
    const here = s.players;
    s.teams = solve(here, 3, Object.assign({}, s.rules, { history: [] }), null, 7);
    s.tourney = buildTourney(s, 5);
    return s;
  }
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const o = JSON.parse(raw);
        if (o && Array.isArray(o.players)) {
          o.rules = Object.assign(defaultRules(), o.rules || {});
          o.rules.weights = Object.assign({}, DEFAULT_OPTS.weights, o.rules.weights || {});
          o.history = o.history || []; o.k = o.k || 3; o.custom = o.custom || ''; o.tab = o.tab || 'session';
          o.groups = Array.isArray(o.groups) ? o.groups : defaultGroups();
          o.players.forEach(p => { p.groups = Array.isArray(p.groups) ? p.groups : []; });
          o.mrules = Object.assign({}, MATCH_DEFAULTS, o.mrules || {});
          o.tcfg = Object.assign(defaultTcfg(), o.tcfg || {});
          o.tourney = o.tourney || null; o.scoreId = o.scoreId || null; o.gfS = o.gfS || ''; o.gfR = o.gfR || '';
          if (o.tab === 'score') o.tab = 'matches';
          return o;
        }
      }
    } catch (e) { /* storage unavailable */ }
    return fresh();
  }
  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ players: S.players, sample: S.sample, rules: S.rules, k: S.k, custom: S.custom, teams: S.teams, history: S.history, tab: S.tab,
        groups: S.groups, mrules: S.mrules, tcfg: S.tcfg, tourney: S.tourney, scoreId: S.scoreId, gfS: S.gfS, gfR: S.gfR }));
    } catch (e) { /* ignore */ }
    push();
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = id => document.getElementById(id);
  const byId = id => S.players.find(p => p.id === id);
  const hereList = () => S.players.filter(p => p.here !== false);
  const engineOpts = () => Object.assign({}, S.rules, { history: S.history });
  const rate = p => overall(p, S.rules.weights);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const byName = (a, b) => a.name.localeCompare(b.name);
  const tcStyle = i => `--tc:var(--t${i % 8});--tci:var(--t${i % 8}i)`;

  function parseCustom(n) {
    const txt = (S.custom || '').trim();
    if (!txt) return null;
    const parts = txt.split(/[^0-9]+/).filter(Boolean).map(Number);
    if (parts.length < 2 || parts.length > 8) return { ok: false, msg: 'Custom sizes need between 2 and 8 numbers, like 6, 6, 5.' };
    const sum = parts.reduce((a, b) => a + b, 0);
    if (sum !== n) return { ok: false, msg: `Custom sizes add up to ${sum}, but ${n} players are here.` };
    return { ok: true, sizes: parts };
  }

  /* ---------- views ---------- */
  function renderTabs() {
    $('tabs').innerHTML = [['session', 'Session'], ['roster', 'Roster'], ['matches', 'Matches'], ['rules', 'Rules']]
      .map(([k, l]) => `<button role="tab" data-act="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}</button>`).join('');
  }

  function sessionView() {
    const here = hereList().sort(byName), n = here.length;
    S.k = clamp(S.k, 2, 8);
    const custom = parseCustom(n);
    let k = S.k, sizes = null, note = '';
    if (custom && custom.ok) { sizes = custom.sizes; k = sizes.length; }
    else if (custom) note = `<div class="note bad">${esc(custom.msg)}</div>`;
    if (!sizes) sizes = teamSizes(n, k);
    const mx = Math.max(...sizes), mn = Math.min(...sizes);
    if (n >= 2 * k) {
      if (mx > 7) note += `<div class="note warn">Teams of ${mx} are more than a rotation needs. Add a team.</div>`;
      else if (mn < 5) note += `<div class="note warn">Teams of ${mn} are very short-handed. Remove a team if you can.</div>`;
    } else note += `<div class="note bad">${n} players is too few for ${k} teams. Mark more people as here, or remove a team.</div>`;

    const attend = `
      <section class="panel">
        <div class="hrow"><h2>Who is here</h2>
          <div class="row"><span class="sub"><b>${n}</b> of ${S.players.length} playing</span>
            <button class="btn small" data-act="allHere">${S.gfS ? 'Add' : 'Select'} all shown</button><button class="btn small" data-act="noHere">Clear shown</button>${S.gfS ? '<button class="btn small" data-act="onlyShown">Only these</button>' : ''}</div></div>
        ${S.groups.length ? `<div class="field"><span class="lbl">Player lists</span>${groupFilterChips('s')}</div>` : ''}
        ${S.players.length ? `<div class="chips">${S.players.filter(p => inGroup(p, S.gfS)).sort(byName).map(p =>
          `<button class="chip" aria-pressed="${p.here !== false}" data-act="toggleHere" data-id="${p.id}">${esc(p.name)} <small>${rate(p).toFixed(1)}</small></button>`).join('')}</div>`
          : `<p class="hint">The roster is empty. Add players on the Roster tab.</p>`}
      </section>`;

    const setup = `
      <section class="panel">
        <h2>Teams</h2>
        <div class="row" style="gap:18px">
          <div class="stepper" aria-label="Number of teams"><button data-act="kMinus" aria-label="Fewer teams">−</button><output>${k}</output><button data-act="kPlus" aria-label="More teams">+</button></div>
          <div class="sizes" aria-label="Team sizes">${sizes.map((s, i) => `<span class="sz" style="${tcStyle(i)}">${s}</span>`).join('')}</div>
        </div>
        <div class="field" style="max-width:260px"><label for="custom">Custom sizes (optional)</label>
          <input type="text" id="custom" data-field="custom" value="${esc(S.custom)}" placeholder="e.g. 6, 6, 5" inputmode="numeric"></div>
        <p class="hint">Sizes follow the player count. With a short team, that team gets stronger players to make up for the missing person (see Rules).</p>
        ${note}
        <div class="row"><button class="btn primary" data-act="build" ${S.busy || n < 2 * k ? 'disabled' : ''}>${S.busy ? 'Building…' : (S.teams ? 'Rebuild teams' : 'Build teams')}</button>
          <span class="sub" role="status">${esc(S.msg || '')}</span></div>
      </section>`;
    return sharePanel() + attend + setup + resultsView();
  }

  function resultsView() {
    if (!S.teams) return '';
    const inTeams = new Set(S.teams.flat());
    const players = S.players.filter(p => inTeams.has(p.id));
    if (players.length < 2) return '';
    const a = analyze(S.teams, players, engineOpts());
    const hereIds = new Set(hereList().map(p => p.id));
    const stale = inTeams.size !== hereIds.size || [...inTeams].some(id => !hereIds.has(id));
    const nm = id => (byId(id) || { name: '?' }).name;

    const pct = a.spreadPct;
    const cls = pct < 2 ? 'good' : pct < 4 ? 'warn' : 'bad';
    const word = pct < 2 ? 'Even' : pct < 4 ? 'Close' : 'Uneven';

    let notes = '';
    if (stale) notes += `<div class="note warn">Attendance has changed since these teams were built. Rebuild to include everyone.</div>`;
    if (a.unmetList.length) notes += `<div class="note">${a.unmetList.map(([x, y]) => `${esc(nm(x))} asked for ${esc(nm(y))}, who is on another team.`).join('<br>')}</div>`;
    if (a.apartList.length) notes += `<div class="note bad">${a.apartList.map(([x, y]) => `${esc(nm(x))} and ${esc(nm(y))} are together despite a keep-apart request.`).join('<br>')}</div>`;
    if (S.rules.requireSetter && a.noSetter) notes += `<div class="note warn">${a.noSetter} team${a.noSetter > 1 ? 's have' : ' has'} no setter. There may not be enough setter-capable players here.</div>`;
    if (S.rules.variety && S.history.length && a.repeats) notes += `<div class="note">${a.repeats} teammate pair${a.repeats > 1 ? 's' : ''} repeat from the last saved session.</div>`;

    const cards = a.teams.map((t, ti) => {
      const rows = t.ids.map(id => {
        const p = byId(id), r = t.rating[id], bench = t.benchIds.includes(id);
        return `<button class="pl ${S.sel === id ? 'sel' : ''}" data-act="pick" data-id="${id}" aria-pressed="${S.sel === id}">
          <span class="nm">${esc(p.name)}${bench ? '<em class="tag">bench</em>' : ''}</span>
          <span class="role">${p.role === 'Any' ? '' : esc(p.role)}</span>
          <span class="rt">${r.toFixed(1)}<span class="bar"><i style="width:${r * 10}%"></i></span></span></button>`;
      }).join('');
      const d = t.delta, ds = (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1);
      const foot = [`Avg ${t.avg.toFixed(1)}`, `${t.setters} setter${t.setters === 1 ? '' : 's'}`];
      if (S.rules.genderBalance) foot.push(`${t.fem} F · ${t.size - t.fem} other`);
      if (S.rules.groupSpread) S.groups.forEach(g => { const c = t.ids.filter(pid => (byId(pid).groups || []).includes(g.id)).length; if (c) foot.push(`${g.name} ${c}`); });
      return `<article class="team" style="${tcStyle(ti)}">
        <div class="team-h"><div><div class="nm">${PINNIES[ti % 8]}</div><div class="ct">${t.size} players${t.missing ? ' · short-handed' : ''}</div></div>
          <div class="tsc"><b>${t.strength.toFixed(1)}</b><span>${ds} vs average</span></div></div>
        ${rows}
        <div class="team-f ${S.rules.requireSetter && !t.setters ? 'bad' : ''}">${foot.map(esc).map(x => `<span>${x}</span>`).join('')}</div></article>`;
    }).join('');

    const skillRows = ATTRS.map((at, ai) => {
      const vals = a.teams.map(t => t.attrAvg[ai]);
      const gap = Math.max(...vals) - Math.min(...vals);
      return `<tr><th scope="row" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)">${at.label}</th>
        ${vals.map(v => `<td>${v.toFixed(1)}<span class="mb"><i style="width:${v * 10}%"></i></span></td>`).join('')}
        <td class="gap ${gap >= 0.8 ? 'hi' : ''}">${gap.toFixed(1)}</td></tr>`;
    }).join('');

    return `
      <section class="panel">
        <div class="hrow"><h2>Result</h2><span class="sub">Tap a player, then another on a different team, to swap them.</span></div>
        <div class="verdict">
          <div class="big ${cls}">${word}</div>
          <div class="stat"><b>${a.spread.toFixed(1)} pts</b><span>Strength gap (${a.spreadPct.toFixed(1)}%)</span></div>
          <div class="stat"><b>${a.wantsTotal ? `${a.wantsMet} of ${a.wantsTotal}` : 'None set'}</b><span>Requests met</span></div>
        </div>
        ${notes}
        <div class="teams">${cards}</div>
        <div class="row">
          <button class="btn" data-act="copyTeams">Copy teams</button>
          <button class="btn" data-act="savePlayed">Save as played</button>
          <button class="btn" data-act="tab" data-tab="matches">Plan matches</button>
          <span class="sub" role="status">${esc(S.msg2 || '')}</span>
        </div>
        ${S.copyText ? `<div class="field"><label for="ct">Select and copy</label><textarea id="ct" readonly>${esc(S.copyText)}</textarea></div>` : ''}
      </section>
      <section class="panel">
        <h2>Skill balance</h2>
        <p class="sub">Average score of each team's six on-court players, short teams topped up. A large gap shows where a team is weak.</p>
        <div class="tbl"><table class="skills"><thead><tr><th>Skill</th>${a.teams.map((t, ti) => `<th style="${tcStyle(ti)}"><span class="dot"></span>${PINNIES[ti % 8]}</th>`).join('')}<th>Gap</th></tr></thead><tbody>${skillRows}</tbody></table></div>
      </section>`;
  }

  function rosterViewBase() {
    const list = S.players.filter(p => inGroup(p, S.gfR)).sort(byName);
    const rows = list.map(p => {
      const bulk = !!(S.bulk && S.bulk.on), open = S.editing === p.id && !bulk;
      const reqs = (p.with || []).length + (p.apart || []).length;
      return `<div><button class="rrow" data-act="edit" data-id="${p.id}" aria-expanded="${open}">
        <span>${bulk ? `<span class="bx ${S.bulk.ids.includes(p.id) ? 'on' : ''}" aria-hidden="true"></span>` : ''}<span class="nm">${esc(p.name || 'Unnamed')}</span> <span class="meta">${(p.groups || []).length ? '· ' + (p.groups || []).map(groupName).join(', ') + ' ' : ''}${p.here === false ? '· not here' : ''}${reqs ? ` · ${reqs} request${reqs > 1 ? 's' : ''}` : ''}</span></span>
        <span class="meta">${p.role === 'Any' ? '' : esc(p.role)}</span>
        <span class="rt" style="font-weight:700;font-variant-numeric:tabular-nums">${rate(p).toFixed(1)}</span></button>
        ${open ? editorView(p) : ''}</div>`;
    }).join('');
    const backup = JSON.stringify({ players: S.players, groups: S.groups, rules: S.rules, mrules: S.mrules, history: S.history });
    return `
      ${S.sample ? `<div class="note warn"><b>Sample roster.</b> These 18 players are examples. Edit them, or <button class="btn small danger" data-act="clearRoster">${S.confirmClear ? 'Tap again to remove all' : 'Remove all'}</button> and add your own.</div>` : ''}
      <section class="panel">
        <div class="hrow"><h2>Roster</h2><div class="row"><span class="sub">${S.players.length} players</span><button class="btn" data-act="bulkToggle" aria-pressed="${!!(S.bulk && S.bulk.on)}">${S.bulk && S.bulk.on ? 'Done selecting' : 'Select several'}</button><button class="btn hl" data-act="draftOpen">Add player</button></div></div>
        <p class="sub">Score each skill from 1 to 10. Tap a player to edit scores, teammate requests and player lists. Changes save on this device.</p>
        ${S.groups.length ? groupFilterChips('r') : ''}
        ${list.length ? `<div class="rlist">${rows}</div>` : `<p class="hint">No players yet. Add the first one.</p>`}
      </section>
      <section class="panel">
        <h2>Backup</h2>
        <p class="sub">Your roster lives in this browser. Copy the backup text somewhere safe, and paste it back here to restore it on another device.</p>
        <div class="field"><label for="bk">Backup text</label><textarea id="bk" data-field="backup">${esc(backup)}</textarea></div>
        <div class="row"><button class="btn" data-act="backupCopy">Copy backup</button><button class="btn" data-act="restore">Restore from text</button><span class="sub" role="status">${esc(S.msg3 || '')}</span></div>
      </section>`;
  }

  function editorView(p) {
    const others = S.players.filter(o => o.id !== p.id).sort(byName);
    const chips = (kind) => others.length ? `<div class="chips">${others.map(o =>
      `<button class="chip sm" aria-pressed="${(p[kind] || []).includes(o.id)}" data-act="toggle-${kind}" data-id="${p.id}" data-other="${o.id}">${esc(o.name)}</button>`).join('')}</div>` : `<p class="hint">Add more players to set requests.</p>`;
    return `<div class="editor">
      <div class="grid3">
        <div class="field"><label for="n-${p.id}">Name</label><input type="text" id="n-${p.id}" data-field="name" data-id="${p.id}" value="${esc(p.name)}"></div>
        <div class="field"><label for="r-${p.id}">Main position</label><select id="r-${p.id}" data-field="role" data-id="${p.id}">${ROLES.map(r => `<option ${p.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
        <div class="field"><label for="g-${p.id}">Gender (optional)</label><select id="g-${p.id}" data-field="gender" data-id="${p.id}">
          <option value="" ${!p.gender ? 'selected' : ''}>Not set</option><option value="F" ${p.gender === 'F' ? 'selected' : ''}>Female</option><option value="M" ${p.gender === 'M' ? 'selected' : ''}>Male</option></select></div>
      </div>
      <div class="ov"><span class="lbl">Overall</span><b id="ov-${p.id}">${rate(p).toFixed(1)}</b><span class="legend">1 learning · 4 casual · 6 solid · 8 strong · 10 competitive</span></div>
      <div style="display:grid;gap:8px">${ATTRS.map(at => `<label class="sk"><span>${at.label}</span>
        <input type="range" min="1" max="10" step="0.1" value="${(+p.s[at.key]).toFixed(1)}" data-skill="${at.key}" data-id="${p.id}" aria-label="${at.label}"><input type="number" class="snum" min="1" max="10" step="0.1" inputmode="decimal" id="sv-${p.id}-${at.key}" value="${(+p.s[at.key]).toFixed(1)}" data-skillnum="${at.key}" data-id="${p.id}" aria-label="${at.label} score"></label>`).join('')}</div>
      <div class="rule" style="border-top:0;padding-top:0"><span class="t">Wants to play with</span>${chips('with')}</div>
      <div class="rule"><span class="t">Keep on a different team from</span>${chips('apart')}</div>
      <div class="rule"><span class="t">Player lists</span>${S.groups.length ? `<div class="chips">${S.groups.map(g =>
        `<button class="chip sm" aria-pressed="${(p.groups || []).includes(g.id)}" data-act="toggleGroup" data-id="${p.id}" data-gid="${g.id}">${esc(g.name)}</button>`).join('')}</div>` : '<p class="hint">No lists yet. Create one in Player lists on this tab.</p>'}</div>
      <div class="row"><label class="check"><input type="checkbox" data-field="here" data-id="${p.id}" ${p.here !== false ? 'checked' : ''}><span>Here this session</span></label>
        <span style="flex:1"></span>
        <button class="btn danger small" data-act="delPlayer" data-id="${p.id}">${S.confirmDel === p.id ? 'Tap again to delete' : 'Delete player'}</button></div>
    </div>`;
  }

  function rulesView() {
    const R = S.rules, W = R.weights;
    const seg = (key, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-act="setRule" data-key="${key}" data-val="${v}" aria-pressed="${R[key] === v}">${l}</button>`).join('')}</div>`;
    return `
      <section class="panel">
        <h2>Team balancing</h2>
        <p class="sub">These shape how teams are scored. Rebuild on the Session tab to apply them to a new draw. The result view updates straight away.</p>

        <div class="rule"><span class="t">Skill weights</span>
          <p class="hint">A player's overall rating is a weighted average of their seven scores. A higher weight also makes the draw match that skill more closely across teams. Set 0 to ignore it.</p>
          <div style="display:grid;gap:8px">${ATTRS.map(at => `<label class="sk"><span>${at.label}</span>
            <input type="range" min="0" max="3" step="0.1" value="${W[at.key]}" data-weight="${at.key}" aria-label="${at.label} weight"><output id="wv-${at.key}">${Number(W[at.key]).toFixed(1)}</output></label>`).join('')}</div></div>

        <div class="rule"><span class="t">Short teams and big teams</span>
          <label class="sk" style="grid-template-columns:150px 1fr 44px"><span>Missing 6th player</span>
            <input type="range" min="0" max="100" step="5" value="${Math.round(R.handicap * 100)}" data-opt="handicap" aria-label="Missing player credit"><output id="ov-handicap">${Math.round(R.handicap * 100)}%</output></label>
          <p class="hint">A team of 5 is credited with this share of an average player for the empty spot. Higher means short teams get weaker players.</p>
          <label class="sk" style="grid-template-columns:150px 1fr 44px"><span>Bench credit</span>
            <input type="range" min="0" max="100" step="5" value="${Math.round(R.bench * 100)}" data-opt="bench" aria-label="Bench credit"><output id="ov-bench">${Math.round(R.bench * 100)}%</output></label>
          <p class="hint">On a team of 7, the seventh player adds this share of their rating, since they rotate in.</p></div>

        <div class="rule"><span class="t">Teammate requests</span>
          ${seg('prefPriority', [[0, 'Off'], [0.5, 'Low'], [1, 'Normal'], [2, 'High']])}
          <p class="hint">How hard the draw tries to put players with who they asked for. Keep-apart requests are always applied first.</p></div>

        <div class="rule"><span class="t">Setters</span>
          <label class="check"><input type="checkbox" data-opt="requireSetter" ${R.requireSetter ? 'checked' : ''}><span>Give every team a setter</span></label>
          <div class="field" style="max-width:300px"><label for="smin">Counts as a setter if Setting is at least</label>
            <select id="smin" data-opt="setterMin">${[6, 7, 8, 9].map(v => `<option ${R.setterMin === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>

  /* ---------- shared live session ----------

     Everything sent is encrypted with a key made from the session code, and the room name is a hash of it, so the
     broker (and anyone else listening) sees only scrambled data. Each part of the state (and each match) is its own

    if (act === 'netShare') { try { await navigator.share({ title: 'Sideout', text: `Join my volleyball session. Code: ${showCode(net.code)}`, url: inviteLink() || undefined }); } catch (err) { /* cancelled */ } return; }
    if (act === 'tab') { S.tab = el.dataset.tab; S.confirmClear = false; S.confirmDel = null; save(); render(); window.scrollTo(0, 0); return; }
    if (act === 'toggleHere') { const p = byId(id); p.here = p.here === false; save(); render(); return; }
    if (act === 'allHere' || act === 'noHere') { S.players.filter(p => inGroup(p, S.gfS)).forEach(p => { p.here = act === 'allHere'; }); save(); render(); return; }
    if (act === 'onlyShown') { S.players.forEach(p => { p.here = inGroup(p, S.gfS); }); save(); render(); return; }
    if (act === 'kMinus' || act === 'kPlus') { S.k = clamp(S.k + (act === 'kPlus' ? 1 : -1), 2, 8); S.custom = ''; save(); render(); return; }
    if (act === 'build') { build(); return; }
    if (act === 'pick') {
      if (!S.sel) S.sel = id;
      else if (S.sel === id) S.sel = null;
      else {
        const ta = S.teams.findIndex(t => t.includes(S.sel)), tb = S.teams.findIndex(t => t.includes(id));
        if (ta === tb) S.sel = id;
        else {
          const ia = S.teams[ta].indexOf(S.sel), ib = S.teams[tb].indexOf(id);
          S.teams[ta][ia] = id; S.teams[tb][ib] = S.sel; S.sel = null; save();
        }
      }
      render(); return;
    }
    if (act === 'copyTeams') {
      const txt = teamsText();
      const ok = await copyOut(txt);
      S.copyText = ok ? '' : txt; S.msg2 = ok ? 'Copied. Paste it into your group chat.' : 'Copy was blocked here. Select the text below.';
      render(); return;
    }
    if (act === 'savePlayed') { S.history = S.teams.map(t => t.slice()); S.msg2 = 'Saved. Turn on Variety in Rules to avoid these pairings next time.'; save(); render(); return; }
    if (act === 'edit' && S.bulk && S.bulk.on) { const b = S.bulk.ids; S.bulk.ids = b.includes(id) ? b.filter(x => x !== id) : b.concat(id); render(); return; }
    if (act === 'edit') { S.editing = S.editing === id ? null : id; S.confirmDel = null; render(); return; }
    if (act === 'delPlayer') {
      if (S.confirmDel !== id) { S.confirmDel = id; render(); return; }
      S.players = S.players.filter(p => p.id !== id);
      S.players.forEach(p => { p.with = (p.with || []).filter(x => x !== id); p.apart = (p.apart || []).filter(x => x !== id); });
      if (S.teams) { S.teams = S.teams.map(t => t.filter(x => x !== id)).filter(t => t.length); if (!S.teams.length) S.teams = null; }
      S.editing = null; S.confirmDel = null; S.sample = false; save(); render(); return;
    }
    if (act === 'toggle-with' || act === 'toggle-apart') {
      const kind = act === 'toggle-with' ? 'with' : 'apart', other = act === 'toggle-with' ? 'apart' : 'with';
      const p = byId(id), o = el.dataset.other;
      p[kind] = p[kind] || []; p[other] = p[other] || [];
      if (p[kind].includes(o)) p[kind] = p[kind].filter(x => x !== o);
      else { p[kind].push(o); p[other] = p[other].filter(x => x !== o); }
      S.sample = false; save(); render(); return;
    }
    if (act === 'clearRoster') {
      if (!S.confirmClear) { S.confirmClear = true; render(); return; }
      S.players = []; S.teams = null; S.sample = false; S.editing = null; S.confirmClear = false; save(); render(); return;
    }
    if (act === 'setRule') { S.rules[el.dataset.key] = Number(el.dataset.val); save(); render(); return; }
    if (act === 'resetRules') { S.rules = defaultRules(); save(); render(); return; }
    if (act === 'backupCopy') {
      const ta = $('bk'); const ok = await copyOut(ta.value);
      if (!ok) { ta.focus(); ta.select(); }
      S.msg3 = ok ? 'Copied.' : 'Copy was blocked here. The text is selected, copy it manually.'; $('view').querySelector('[data-act="backupCopy"]').parentNode.querySelector('[role="status"]').textContent = S.msg3; return;
    }
    if (act === 'restore') {
      try {
        const o = JSON.parse($('bk').value);
        if (!o || !Array.isArray(o.players)) throw new Error('bad');
        const clean = o.players.filter(p => p && p.id && p.name && p.s).map(p => ({
          id: String(p.id), name: String(p.name), role: ROLES.includes(p.role) ? p.role : 'Any', gender: p.gender === 'F' || p.gender === 'M' ? p.gender : '',
          here: p.here !== false, groups: Array.isArray(p.groups) ? p.groups.map(String) : [], with: Array.isArray(p.with) ? p.with.map(String) : [], apart: Array.isArray(p.apart) ? p.apart.map(String) : [],
          s: Object.fromEntries(ATTRS.map(a => [a.key, clamp(Math.round((Number(p.s[a.key]) || 5) * 10) / 10, 1, 10)]))
        }));
        S.players = clean; S.sample = false; S.teams = null; S.tourney = null; S.scoreId = null; S.editing = null;
        S.groups = Array.isArray(o.groups) ? o.groups.filter(g => g && g.id && g.name).map(g => ({ id: String(g.id), name: String(g.name) })) : defaultGroups();
        if (o.mrules) S.mrules = Object.assign({}, MATCH_DEFAULTS, o.mrules);
        if (o.rules) { S.rules = Object.assign(defaultRules(), o.rules); S.rules.weights = Object.assign({}, DEFAULT_OPTS.weights, o.rules.weights || {}); }
        S.history = Array.isArray(o.history) ? o.history : [];
        S.msg3 = `Restored ${clean.length} players.`; save(); render();
      } catch (err) { S.msg3 = 'That text is not a valid backup.'; render(); }
      return;
    }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.skill) {
      const p = byId(t.dataset.id); p.s[t.dataset.skill] = Number(t.value); S.sample = false;
      $('sv-' + p.id + '-' + t.dataset.skill).value = Number(t.value).toFixed(1); $('ov-' + p.id).textContent = rate(p).toFixed(1); save();
    } else if (t.dataset.weight) {
      S.rules.weights[t.dataset.weight] = Number(t.value); $('wv-' + t.dataset.weight).textContent = Number(t.value).toFixed(1); save();
    } else if (t.dataset.opt === 'handicap' || t.dataset.opt === 'bench') {
      S.rules[t.dataset.opt] = Number(t.value) / 100; $('ov-' + t.dataset.opt).textContent = t.value + '%'; save();
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.skill || t.dataset.weight || t.dataset.opt === 'handicap' || t.dataset.opt === 'bench') { render(); return; }
    if (t.dataset.opt) {
      const k = t.dataset.opt;
      S.rules[k] = t.type === 'checkbox' ? t.checked : Number(t.value); save(); render(); return;
    }
    if (t.dataset.field === 'custom') { S.custom = t.value; save(); render(); return; }
    if (t.dataset.field) {
      const p = byId(t.dataset.id); if (!p) return;
      if (t.dataset.field === 'here') p.here = t.checked; else p[t.dataset.field] = t.type === 'checkbox' ? t.checked : t.value.trim() || (t.dataset.field === 'name' ? 'Unnamed' : t.value);
      S.sample = false; save(); render();

  });

  /* ================= player lists, matches, scoring ================= */
  function defaultGroups() { return [{ id: 'g1', name: 'IHG participants' }, { id: 'g2', name: 'H9 residents' }, { id: 'g3', name: 'Outsiders' }]; }
  function defaultTcfg() { return { courts: 1 }; }
  function sigOf(teams) { return JSON.stringify((teams || []).map(t => t.slice().sort())); }
  function emptyTourney() { return { teams: [], matches: [], seq: 0, rounds: 0, games: 0, courts: 1, sig: '' }; }

  function inGroup(p, gid) {
    if (!gid) return true;
    if (gid === 'none') return !(p.groups || []).length;
    return (p.groups || []).includes(gid);
  }
  function groupFilterChips(kind) {
    const cur = (kind === 's' ? S.gfS : S.gfR) || '';
    const mk = (gid, label) => {
      const members = S.players.filter(p => inGroup(p, gid));
      const small = kind === 's' ? `${members.filter(p => p.here !== false).length}/${members.length}` : members.length;
      return `<button class="chip sm" aria-pressed="${cur === gid}" data-act="gf" data-kind="${kind}" data-gid="${gid}">${esc(label)} <small>${small}</small></button>`;
    };
    const ungrouped = S.groups.length && S.players.some(p => !(p.groups || []).length);
    return `<div class="chips">${mk('', 'All')}${S.groups.map(g => mk(g.id, g.name)).join('')}${ungrouped ? mk('none', 'No list') : ''}</div>`;
  }
  function groupsPanel() {
    return `<section class="panel">
      <div class="hrow"><h2>Player lists</h2><span class="sub">${S.groups.length} list${S.groups.length === 1 ? '' : 's'}</span></div>
      <p class="sub">Group players however suits your sessions, for example by hall, club or group. A player can be in several lists. Open a player to choose their lists, then pick a list on the Session tab to bring everyone in it.</p>
      ${S.groups.length ? `<div style="display:grid;gap:8px">${S.groups.map(g => {
        const n = S.players.filter(p => (p.groups || []).includes(g.id)).length;
        return `<div class="grow"><input type="text" data-gname="${g.id}" value="${esc(g.name)}" aria-label="List name"><span class="sub">${n} player${n === 1 ? '' : 's'}</span>
          <button class="btn danger small" data-act="delGroup" data-id="${g.id}">${S.confirmGrp === g.id ? 'Tap again' : 'Delete'}</button></div>`;
      }).join('')}</div>` : '<p class="hint">No lists yet. Add the first one below.</p>'}
      <div class="row"><input type="text" id="newgroup" placeholder="New list name" style="max-width:260px"><button class="btn" data-act="addGroup">Add list</button></div>
    </section>`;
  }

    const at = html.indexOf('<h2>Backup</h2>');
    const i = html.lastIndexOf('<section', at);
    const flash = S.flash; S.flash = '';
    return (flash ? `<div class="note good" role="status">${esc(flash)}</div>` : '') + draftPanel() + bulkPanel() + html.slice(0, i) + groupsPanel() + html.slice(i);
  }

  /* ---- new player form and multi-select list assignment ---- */
  const round1 = v => Math.round(v * 10) / 10;
  function groupName(gid) { const g = S.groups.find(x => x.id === gid); return g ? g.name : '?'; }
  function newDraft() {
    return { name: '', role: 'Any', gender: '', groups: [], s: { serve: 5, receive: 5, set: 5, spike: 5, block: 5, defend: 5, athletic: 5 } };
  }
  function draftPanel() {
    const D = S.draft;
    if (!D) return '';
    const ov = overall({ s: D.s }, S.rules.weights);

      <div class="row"><button class="btn hl" data-act="draftSave" data-more="0">Add player</button><button class="btn" data-act="draftSave" data-more="1">Add and start another</button><button class="btn" data-act="draftCancel">Cancel</button></div>

      <div class="field"><span class="lbl">Lists</span>${S.groups.length
        ? `<div class="chips">${S.groups.map(g => `<button class="chip sm" aria-pressed="${B.lists.includes(g.id)}" data-act="bulkList" data-gid="${g.id}">${esc(g.name)}</button>`).join('')}</div>`
        : '<p class="hint">Create a list first in Player lists, further down this tab.</p>'}</div>
      <div class="row">
        <button class="btn hl" data-act="bulkApply" data-mode="add" ${n && L ? '' : 'disabled'}>Add ${n || ''} to ${L === 1 ? esc(names[0]) : L ? L + ' lists' : 'lists'}</button>
        <button class="btn" data-act="bulkApply" data-mode="remove" ${n && L ? '' : 'disabled'}>Remove from ${L === 1 ? 'list' : 'lists'}</button>

  /* ---- matches: suggested format, schedule and live scoring in one place ---- */
  function formatName(k, T) { return T === 2 ? `${k} matches between the two teams` : ['', 'Single', 'Double', 'Triple', 'Quadruple'][k] + ' round robin'; }
  function buildTourney(s, seed) {
    const teams = (s.teams || []).map((ids, i) => ({
      id: 'T' + i, idx: i,
      players: ids.slice().sort((x, y) => {
        const px = s.players.find(p => p.id === x), py = s.players.find(p => p.id === y);
        return (py ? overall(py, s.rules.weights) : 0) - (px ? overall(px, s.rules.weights) : 0);
      })
    }));
    const T = teams.length, fmt = suggestFormat(T, s.tcfg.courts);
    let seq = 0; const matches = [];
    if (fmt) {
      const sched = buildSchedule(T, s.tcfg.courts, chosenG(s, T), seed, teams.map(t => (t.players.length <= 6 ? 1 : 6 / t.players.length)));
      sched.slots.forEach((sl, si) => sl.forEach(([i, j], ci) => {
        matches.push({ id: 'm' + (++seq), slot: si, court: ci + 1, stage: 'rr', block: 1, a: 'T' + i, b: 'T' + j, log: '', firstServe: 'a', flip: false, sub: { a: 0, b: 0 }, rules: Object.assign({}, s.mrules) });
      }));
    }
    return { teams, matches, seq, courts: s.tcfg.courts, blocks: 1, g: fmt ? chosenG(s, T) : 0, sig: sigOf(s.teams) };
  }
  function addBlock() {
    const tn = S.tourney, T = tn.teams.length, fmt = suggestFormat(T, tn.courts);
    if (!fmt) return;
    const base = Math.max(-1, ...tn.matches.filter(m => m.stage === 'rr').map(m => m.slot)) + 1;
    const sched = buildSchedule(T, tn.courts, tn.g || fmt.g, null, tn.teams.map(t => (t.players.length <= 6 ? 1 : 6 / t.players.length)));
    tn.blocks = (tn.blocks || 1) + 1;
    sched.slots.forEach((sl, si) => sl.forEach(([i, j], ci) => {
      tn.matches.push({ id: 'm' + (++tn.seq), slot: base + si, court: ci + 1, stage: 'rr', block: tn.blocks, a: 'T' + i, b: 'T' + j, log: '', firstServe: 'a', flip: false, sub: { a: 0, b: 0 }, rules: Object.assign({}, S.mrules) });
    }));
  }
  const otherSide = s => (s === 'a' ? 'b' : 'a');
  const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)]);
  const findMatch = id => (S.tourney && id ? S.tourney.matches.find(m => m.id === id) : null);
  const mrep = m => replay(m.log, m.rules, m.firstServe);
  const rrMatches = () => (S.tourney ? S.tourney.matches.filter(m => m.stage !== 'quick') : []);
  const matchOrder = () => rrMatches().slice().sort((x, y) => x.slot - y.slot || x.court - y.court);
  /* the match on the scoreboard: the one picked, else the one in play, else the next one to play */
  function activeMatch() {
    const sel = findMatch(S.scoreId);
    if (sel) return sel;
    const ord = matchOrder();
    return ord.find(m => { const r = mrep(m); return !r.winner && r.used > 0; }) || ord.find(m => !mrep(m).winner) || null;
  }
  let curMatch = null;
  function sideInfo(m, s) {
    const id = m[s], t = id && S.tourney && S.tourney.teams.find(x => x.id === id);
    if (t) return { name: PINNIES[t.idx % 8], idx: t.idx, players: t.players.filter(pid => byId(pid)), id };
    const d = m['d' + s] || { name: s === 'a' ? 'Team A' : 'Team B', idx: s === 'a' ? 0 : 1, players: [] };
    return { name: d.name, idx: d.idx, players: (d.players || []).filter(pid => byId(pid)), id: null };
  }
  const tp = I => `<span class="tp" style="${tcStyle(I.idx)}"><span class="dot"></span>${esc(I.name)}</span>`;
  function rulesText(R) {
    let t = `First to ${R.target}`;
    if (R.winBy2) t += ', win by 2';
    if (R.cap) t += `, cap ${R.cap}`;
    if (R.bestOf > 1) t += ` · best of ${R.bestOf} sets, last set to ${R.decider}`;
    return t;
  }
  function scoreLine(m, r) { return m.rules.bestOf > 1 ? `${r.won.a}–${r.won.b} sets` : `${r.sets[0].a}–${r.sets[0].b}`; }
  function firstOpenSlot() {
    const open = rrMatches().filter(m => !mrep(m).winner).map(m => m.slot);
    return open.length ? Math.min(...open) : -1;
  }
  const standingsRows = () => standings(S.tourney.teams.map(t => t.id), S.tourney.matches.filter(m => m.stage === 'rr'));
  function rrSlotsForStats() {
    const tn = S.tourney, out = [];
    tn.matches.filter(m => m.stage === 'rr').forEach(m => {
      (out[m.slot] = out[m.slot] || []).push([tn.teams.findIndex(t => t.id === m.a), tn.teams.findIndex(t => t.id === m.b)]);
    });
    return out.filter(Boolean);
  }
  function finalPlaces() {
    const tn = S.tourney, out = [];
    tn.matches.filter(m => m.stage === 'pl').forEach(m => {
      const r = mrep(m); if (!r.winner) return;
      out.push({ rank: m.rank, id: m[r.winner] }, { rank: m.rank + 1, id: m[otherSide(r.winner)] });
    });
    if (tn.bye) out.push({ rank: tn.teams.length, id: tn.bye });
    return out.sort((x, y) => x.rank - y.rank);
  }
  const playoffDone = () => { const pl = S.tourney.matches.filter(m => m.stage === 'pl'); return pl.length > 0 && pl.every(m => mrep(m).winner); };

  function matchRow(m, label) {
    const r = mrep(m), A = sideInfo(m, 'a'), B = sideInfo(m, 'b');
    const done = !!r.winner, live = !done && r.used > 0, open = firstOpenSlot();
    let badge;
    if (done) badge = `<span class="badge done">${esc(scoreLine(m, r))}</span>`;
    else if (live) badge = `<span class="badge live">Live ${r.disp.a}–${r.disp.b}</span>`;
    else if (m.stage !== 'quick' && m.slot === open) badge = '<span class="badge next">Up next</span>';
    else badge = '<span class="badge">Upcoming</span>';
    const lbl = label != null ? label : (S.tourney.courts > 1 && m.stage !== 'quick' ? `Court ${m.court}` : '');
    const cur = curMatch && curMatch.id === m.id;
    return `<button class="mrow ${cur ? 'cur' : ''}" data-act="openMatch" data-id="${m.id}" ${cur ? 'aria-current="true"' : ''}>
      ${lbl ? `<span class="court">${esc(lbl)}</span>` : ''}
      <span class="vs">${tp(A)}<span class="x">vs</span>${tp(B)}</span>${badge}</button>`;
  }
  function schedulePanel() {
    const tn = S.tourney, ms = rrMatches();
    const bySlot = new Map();
    ms.forEach(m => { if (!bySlot.has(m.slot)) bySlot.set(m.slot, []); bySlot.get(m.slot).push(m); });
    const slots = [...bySlot.keys()].sort((x, y) => x - y);
    const done = ms.filter(m => mrep(m).winner).length;
    const multi = (tn.blocks || 1) > 1, quick = tn.matches.filter(m => m.stage === 'quick');
    const plCount = slots.filter(x => bySlot.get(x)[0].stage === 'pl').length;
    let plNo = 0;
    return `<section class="panel">
      <div class="hrow"><h2>Schedule</h2><span class="sub">${done} of ${ms.length} matches done · tap a match to score it</span></div>
      ${slots.map(si => {
        const list = bySlot.get(si).sort((a, b) => a.court - b.court);
        const playoff = list[0].stage === 'pl';
        if (playoff) plNo++;
        const playing = new Set(list.flatMap(m => [m.a, m.b]));
        const rest = tn.teams.filter(t => !playing.has(t.id));
        return `<div class="slotbox"><div class="slot-h"><b>${playoff ? 'Play-off' + (plCount > 1 ? ' ' + plNo : '') : 'Round ' + (si + 1)}</b><span>${!playoff && multi ? 'Block ' + (list[0].block || 1) : ''}</span></div>
          ${list.map(m => matchRow(m)).join('')}
          ${rest.length ? `<div class="rest">Resting: ${rest.map(t => PINNIES[t.idx % 8]).join(', ')}</div>` : ''}</div>`;
      }).join('')}
      ${quick.length ? `<div class="slotbox"><div class="slot-h"><b>Extra games</b></div>${quick.map(m => matchRow(m)).join('')}</div>` : ''}
      ${nextSteps()}
    </section>`;
  }

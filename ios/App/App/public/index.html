    }
    /* new player form */
    if (act === 'draftOpen') { S.draft = newDraft(); S.bulk = null; S.editing = null; render(); window.scrollTo(0, 0); const i = $('dname'); if (i) i.focus(); return; }
    if (act === 'draftCancel') { S.draft = null; render(); return; }
    if (act === 'draftGroup') {
      const D = S.draft, gid = el.dataset.gid; if (!D) return;
      D.groups = D.groups.includes(gid) ? D.groups.filter(x => x !== gid) : D.groups.concat(gid); render(); return;
    }
    if (act === 'draftSave') {
      const D = S.draft; if (!D) return;
      const name = (D.name || '').trim();
      if (!name) { S.flash = 'Enter a name first.'; render(); const i = $('dname'); if (i) i.focus(); return; }
      S.players.push({ id: 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e3), name, role: D.role, gender: D.gender, here: true, with: [], apart: [], groups: D.groups.slice(), s: Object.assign({}, D.s) });
      S.sample = false;
      const more = el.dataset.more === '1';
      S.flash = `${name} added${D.groups.length ? ' to ' + D.groups.map(groupName).join(', ') : ''}.`;
      S.draft = more ? Object.assign(newDraft(), { groups: D.groups.slice(), role: D.role }) : null;
      save(); render();
      if (more) { const i = $('dname'); if (i) i.focus(); }
      return;
    }
    /* select several, then choose lists */
    if (act === 'bulkToggle') { S.bulk = S.bulk && S.bulk.on ? null : { on: true, ids: [], lists: [] }; S.draft = null; S.editing = null; render(); return; }
    if (act === 'bulkAll') { if (S.bulk) S.bulk.ids = S.players.filter(p => inGroup(p, S.gfR)).map(p => p.id); render(); return; }
    if (act === 'bulkNone') { if (S.bulk) S.bulk.ids = []; render(); return; }
    if (act === 'bulkList') {
      const B = S.bulk, gid = el.dataset.gid; if (!B) return;
      B.lists = B.lists.includes(gid) ? B.lists.filter(x => x !== gid) : B.lists.concat(gid); render(); return;
    }
    if (act === 'bulkApply') {
      const B = S.bulk; if (!B || !B.ids.length || !B.lists.length) return;
      const add = el.dataset.mode === 'add';
      B.ids.forEach(pid => {
        const p = byId(pid); if (!p) return;
        p.groups = p.groups || [];
        B.lists.forEach(gid => { if (add) { if (!p.groups.includes(gid)) p.groups.push(gid); } else p.groups = p.groups.filter(x => x !== gid); });
      });
      S.flash = `${add ? 'Added' : 'Removed'} ${B.ids.length} player${B.ids.length === 1 ? '' : 's'} ${add ? 'to' : 'from'} ${B.lists.map(groupName).join(', ')}.`;
      B.ids = []; B.lists = []; S.sample = false; save(); render(); return;
    }
    /* format and schedule */
    if (act === 'tc') {
      const c = S.tcfg, d = Number(el.dataset.d), T = S.teams ? S.teams.length : 2;
      if (el.dataset.key === 'games') {
        const sug = suggestFormat(T, c.courts), v = clamp(chosenG(S, T) + d, 1, maxMatchesPerTeam(T));
        c.games = sug && v === sug.g ? 0 : v;
      } else c.courts = clamp(c.courts + d, 1, 4);
      S.confirmGen = false; save(); render(); return;
    }
    if (act === 'tcSet') {
      const T = S.teams ? S.teams.length : 2, sug = suggestFormat(T, S.tcfg.courts), v = Number(el.dataset.val);
      S.tcfg.games = !v || (sug && v === sug.g) ? 0 : v; S.confirmGen = false; save(); render(); return;
    }
    if (act === 'genSchedule') {
      const started = tn && tn.matches.some(m => m.stage !== 'quick' && m.log);
      if (started && !S.confirmGen) { S.confirmGen = true; render(); return; }
      S.confirmGen = false;
      if (!S.teams || S.teams.length < 2) return;
      const quick = tn ? tn.matches.filter(m => m.stage === 'quick') : [];
      S.tourney = buildTourney(S, null);
      quick.forEach(q => S.tourney.matches.push(q));
      S.scoreId = null; save(); render(); window.scrollTo(0, 0); return;
    }
    if (act === 'addBlock') { addBlock(); S.scoreId = null; save(); render(); window.scrollTo(0, 0); return; }
    if (act === 'addPlacement') {
      const ranked = standingsRows().map(r => r.id), { pairs, bye } = placementPairs(ranked);
      const base = Math.max(-1, ...tn.matches.filter(m => m.stage !== 'quick').map(m => m.slot)) + 1;
      const M = Math.max(1, tn.courts);
      pairs.map((p, k) => ({ p, rank: 2 * k + 1 })).reverse().forEach((x, n) => {
        tn.matches.push({ id: 'm' + (++tn.seq), slot: base + Math.floor(n / M), court: (n % M) + 1, stage: 'pl', rank: x.rank, a: x.p[0], b: x.p[1], log: '', firstServe: 'a', flip: false, sub: { a: 0, b: 0 }, rules: Object.assign({}, S.mrules) });
      });
      tn.bye = bye; S.scoreId = null; save(); render(); window.scrollTo(0, 0); return;
    }
    if (act === 'dropPlacement') { tn.matches = tn.matches.filter(m => m.stage !== 'pl'); tn.bye = null; save(); render(); return; }
    /* scoring */
    if (act === 'openMatch') { S.scoreId = id; S.confirmReset = null; save(); render(); window.scrollTo(0, 0); return; }
    if (act === 'scBack') { S.scoreId = null; S.confirmReset = null; save(); render(); window.scrollTo(0, 0); return; }
    if (act === 'quickStart') {
      const t = S.tourney || (S.tourney = { teams: [], matches: [], seq: 0, courts: 1, blocks: 1, sig: '' }), T = S.teams ? S.teams.length : 0;
      let da, db;
      if (T >= 2 && $('qa') && $('qb')) {
        const ia = Number($('qa').value); let ib = Number($('qb').value);
        if (ia === ib) ib = (ia + 1) % T;
        da = quickSide(ia); db = quickSide(ib);
      } else { da = { name: 'Team A', idx: 0, players: [] }; db = { name: 'Team B', idx: 1, players: [] }; }
      const qid = 'q' + Date.now().toString(36);
      t.matches.push({ id: qid, slot: -1, court: 1, stage: 'quick', a: null, b: null, da, db, log: '', firstServe: 'a', flip: false, sub: { a: 0, b: 0 }, rules: Object.assign({}, S.mrules) });
      S.scoreId = qid; save(); render(); window.scrollTo(0, 0); return;
    }
    const m = tn ? activeMatch() : null;
    if (act === 'pt') {
      if (!m || mrep(m).winner) return;
      S.scoreId = m.id; m.log += el.dataset.side;
      try { navigator.vibrate && navigator.vibrate(12); } catch (err) { /* ignore */ }
      save(); render();
      const b = document.querySelector('.sc[data-side="' + el.dataset.side + '"]'); if (b) b.focus({ preventScroll: true });
      return;
    }
    if (act === 'undo') { if (m) { S.scoreId = m.id; m.log = m.log.slice(0, -1); save(); render(); } return; }
    if (act === 'flip') { if (m) { m.flip = !m.flip; save(); render(); } return; }
    if (act === 'serve') { if (m && !m.log) { m.firstServe = el.dataset.side; save(); render(); } return; }
    if (act === 'subDo') { if (m) { m.sub[el.dataset.side]++; save(); render(); } return; }
    if (act === 'toggleRules') { S.rulesOpen = S.rulesOpen === id ? null : id; render(); return; }
    if (act === 'resetMatch') {
      const mm = findMatch(id); if (!mm) return;
      if (S.confirmReset !== id) { S.confirmReset = id; render(); return; }
      S.confirmReset = null;
      if (mm.stage === 'quick') { tn.matches = tn.matches.filter(x => x.id !== id); S.scoreId = null; }
      else { mm.log = ''; mm.sub = { a: 0, b: 0 }; }
      save(); render(); return;
    }
    if (act === 'navMatch') {
      const ord = matchOrder(), i = ord.findIndex(x => m && x.id === m.id), nx = ord[i + Number(el.dataset.d)];
      if (nx) { S.scoreId = nx.id; save(); render(); window.scrollTo(0, 0); }
      return;
    }
    if (act === 'nextMatch') {
      const ord = matchOrder(), i = ord.findIndex(x => m && x.id === m.id);
      const nx = ord.slice(i + 1).find(x => !mrep(x).winner) || ord.find(x => !mrep(x).winner && (!m || x.id !== m.id));
      S.scoreId = nx ? nx.id : null; save(); render(); window.scrollTo(0, 0); return;
    }
    if (act === 'mrStep' || act === 'mrSet') {
      const R = rulesFor(el.dataset.scope); if (!R) return;
      if (act === 'mrSet') applyRule(R, el.dataset.key, Number(el.dataset.val));
      else applyRule(R, el.dataset.key, null, Number(el.dataset.d));
      afterRule(el.dataset.scope); save(); render(); return;
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.draft && S.draft) { S.draft[t.dataset.draft] = t.value; return; }
    if (t.dataset.dskill && S.draft) {
      const v = round1(Number(t.value)); S.draft.s[t.dataset.dskill] = v;
      $('dsv-' + t.dataset.dskill).value = v.toFixed(1);
      $('dov').textContent = overall({ s: S.draft.s }, S.rules.weights).toFixed(1);
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.skillnum) {
      const p = byId(t.dataset.id), v = Number(t.value);
      if (p && t.value !== '' && isFinite(v)) { p.s[t.dataset.skillnum] = clamp(round1(v), 1, 10); S.sample = false; save(); }
      render(); return;
    }
    if (t.dataset.dskillnum && S.draft) {
      const v = Number(t.value);
      if (t.value !== '' && isFinite(v)) S.draft.s[t.dataset.dskillnum] = clamp(round1(v), 1, 10);
      render(); return;
    }
    if (t.dataset.mr) {
      const R = rulesFor(t.dataset.scope);
      if (R) { R[t.dataset.mr] = t.checked; afterRule(t.dataset.scope); save(); render(); }
      return;
    }
    if (t.dataset.gname) {
      const g = S.groups.find(x => x.id === t.dataset.gname);
      if (g) { g.name = t.value.trim() || g.name; save(); render(); }
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target && e.target.id === 'newgroup') {
      e.preventDefault();
      const b = document.querySelector('[data-act="addGroup"]'); if (b) b.click();
    }
    if (e.key === 'Enter' && e.target && e.target.id === 'dname') {
      e.preventDefault();
      const b = document.querySelector('[data-act="draftSave"][data-more="1"]'); if (b) b.click();
    }
  });

  render();
  bootNet();
  window.addEventListener('hashchange', () => { if (/join=/.test(location.hash)) bootNet(); });
})();
</script>

</body>
</html>
